services:
  capjs:
    build: capjs/standalone
    # restart: unless-stopped
    user: "1000:1000"   # stesso utente dell'init
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      # opzionale: montare config dall’host
      # - ./etc/cap.config.js:/app/cap.config.js:ro
    environment:
      DATA_PATH: /data
      # in produzione spostare su un secret/vault
      ADMIN_KEY: your_secret_password_your_secret_password
      WIDGET_VERSION: 0.1.33
      WASM_VERSION: 0.0.6
      ENABLE_ASSETS_SERVER: true
      CORS_ORIGIN: "*"
      LOGIN_PAGE_ENABLED: true
      HIDE_RATELIMIT_IP_WARNING: true

  demo:
    build: ./demo
    user: "1000:1000"
    ports:
      - "5000:5000"
    volumes:
      - ./shared:/shared
    depends_on:
      - demo-init

  demo001:
    build: ./demo001
    user: "1000:1000"
    ports:
      - "5001:5000"
    volumes:
      # demo001 legge qui le chiavi generate da demo-init quando SITE_KEY e
      # SECRET_KEY non sono valorizzate: così `docker compose up` funziona
      # senza dover copiare a mano le chiavi in questo file. In produzione le
      # chiavi vanno impostate qui sotto come environment, non lette dal
      # volume.
      - ./shared:/shared:ro
    environment:
      CAPJS_INTERNAL_URL: http://capjs:3000
      CAPJS_PUBLIC_URL: http://localhost:3000
      # SITE_KEY: "LA_TUA_SITE_KEY"
      # SECRET_KEY: "LA_TUA_SECRET_KEY"
    depends_on:
      - demo-init

  demo-init:
    build: ./demo-init
    user: "1000:1000"
    volumes:
      - ./data:/data
      - ./shared:/shared
    restart: "no"
    depends_on:
      - capjs
